<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#090d16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Fitness Interval & Endurance Counter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body data-phase="idle">

  <main class="app-shell">
    <!-- 1. TOP BAR -->
    <header class="top-bar">
      <div class="brand">
        <span class="brand-dot" id="wakeLockIndicator" title="Screen Wake Lock"></span>
        <span id="brandTitle">FITNESS COUNTER</span>
      </div>
      <div class="top-controls">
        <button type="button" class="sound-pill" id="beepGainBtn" title="Cycle Beep Loudness">
          <span>🔊</span>
          <span class="gain-val" id="beepGainLabel">MAX</span>
        </button>
        <button type="button" class="sound-pill" id="voiceToggleBtn" title="Toggle Voice Announcements">
          <span>🗣️ Voice:</span>
          <span class="gain-val" id="voiceToggleLabel">ON</span>
        </button>
        <button type="button" class="sound-pill" id="testBeepBtn" aria-label="Test Sound & Voice">
          <span>🔔 Test</span>
        </button>
      </div>
    </header>

    <!-- 2. MODE SWITCHER (INTERVALS vs LONG SECTION) -->
    <nav class="mode-tabs" aria-label="Workout Mode Selection">
      <button type="button" class="mode-tab active" id="tabIntervals" data-mode="intervals">
        <span>⏱️ Rounds & Splits</span>
      </button>
      <button type="button" class="mode-tab" id="tabLongSection" data-mode="longSection">
        <span>⏳ Long Section</span>
      </button>
    </nav>

    <!-- 3. HERO RING COUNTDOWN -->
    <section class="timer-stage" aria-live="polite">
      <div class="ring-container" id="ringContainer">
        <svg class="ring-svg" viewBox="0 0 220 220">
          <circle class="ring-track" cx="110" cy="110" r="98"></circle>
          <circle class="ring-progress" id="ringProgress" cx="110" cy="110" r="98"></circle>
        </svg>
        <div class="timer-readout">
          <span class="phase-badge" id="phaseBadge">READY • WORK</span>
          <div class="digits-main" id="timeDisplay">40</div>
          <div class="cycle-sub" id="cycleSubDisplay">
            <span id="cycleSubLeft">Loop: <strong>60s</strong></span>
            <span>•</span>
            <span id="cycleSubRight">Round <strong id="roundCountDisplay">1</strong></span>
          </div>
        </div>
      </div>
    </section>

    <!-- 4A. INTERVAL CONFIGURATOR PANEL -->
    <section class="config-panel" id="intervalsPanel" aria-label="Interval Split and Rounds Configuration">
      <!-- 60s Split Header -->
      <div class="split-header">
        <div class="split-pill sec-a">
          <span class="label">Section A (Work)</span>
          <span class="val" id="secALabel">45s</span>
        </div>
        <div class="split-pill sec-b">
          <span class="label">Section B (Off)</span>
          <span class="val" id="secBLabel">15s</span>
        </div>
      </div>

      <!-- Slider Row -->
      <div class="slider-row">
        <button type="button" class="step-btn" id="stepMinusBtn" aria-label="Decrease Section A by 5 seconds">-5</button>
        <div class="range-wrap">
          <input type="range" id="splitSlider" min="5" max="55" step="1" value="45" aria-label="Section A duration in seconds" />
        </div>
        <button type="button" class="step-btn" id="stepPlusBtn" aria-label="Increase Section A by 5 seconds">+5</button>
      </div>

      <!-- Quick Presets -->
      <div class="presets-row">
        <button type="button" class="preset-chip active" data-split="45">45s / 15s</button>
        <button type="button" class="preset-chip" data-split="40">40s / 20s</button>
        <button type="button" class="preset-chip" data-split="30">30s / 30s</button>
        <button type="button" class="preset-chip" data-split="50">50s / 10s</button>
      </div>

      <!-- Rest Block Interval Configurator -->
      <div class="rest-block-config">
        <div class="config-row-title">
          <span>🛑 Rest Interval Between Rounds</span>
        </div>
        <div class="rest-settings-grid">
          <div class="setting-item">
            <label for="restEveryRounds">Every</label>
            <select id="restEveryRounds" aria-label="Select rounds before rest period">
              <option value="0">Off (No rest)</option>
              <option value="2">2 Rounds</option>
              <option value="3">3 Rounds</option>
              <option value="4" selected>4 Rounds</option>
              <option value="5">5 Rounds</option>
              <option value="6">6 Rounds</option>
              <option value="8">8 Rounds</option>
              <option value="10">10 Rounds</option>
            </select>
          </div>
          <div class="setting-item">
            <label for="restDuration">Rest Duration</label>
            <select id="restDuration" aria-label="Select rest duration">
              <option value="30">30 Seconds</option>
              <option value="45">45 Seconds</option>
              <option value="60" selected>1 Minute</option>
              <option value="90">1.5 Minutes</option>
              <option value="120">2 Minutes</option>
              <option value="180">3 Minutes</option>
            </select>
          </div>
        </div>
        <div class="rest-summary-text" id="restSummaryText">
          Rest 1m after every 4 rounds
        </div>
      </div>
    </section>

    <!-- 4B. LONG SECTION CONFIGURATOR PANEL -->
    <section class="config-panel hidden" id="longSectionPanel" aria-label="Long Section Countdown Configuration">
      <div class="long-header">
        <div class="long-pill">
          <span class="label">Long Section Duration</span>
          <span class="val" id="longDurationLabel">8m 00s</span>
        </div>
        <div class="voice-badge" id="voiceNoticeBadge">
          <span>🗣️ High-Energy Voice Coach</span>
        </div>
      </div>

      <!-- Long Duration Slider (1 to 15 mins) -->
      <div class="slider-row">
        <button type="button" class="step-btn" id="longMinusBtn" aria-label="Decrease Long Section by 1 minute">-1m</button>
        <div class="range-wrap">
          <input type="range" id="longSlider" min="1" max="15" step="1" value="8" aria-label="Long Section duration in minutes" />
        </div>
        <button type="button" class="step-btn" id="longPlusBtn" aria-label="Increase Long Section by 1 minute">+1m</button>
      </div>

      <!-- Long Section Presets -->
      <div class="presets-row">
        <button type="button" class="preset-chip long-chip" data-mins="15">15 min</button>
        <button type="button" class="preset-chip long-chip" data-mins="10">10 min</button>
        <button type="button" class="preset-chip long-chip active" data-mins="8">8 min</button>
        <button type="button" class="preset-chip long-chip" data-mins="5">5 min</button>
        <button type="button" class="preset-chip long-chip" data-mins="3">3 min</button>
        <button type="button" class="preset-chip long-chip" data-mins="1">1 min</button>
      </div>

      <div class="long-voice-info">
        <span>📢 Dramatic Voice Coach: high-energy motivation & countdown at every single minute mark!</span>
      </div>
    </section>

    <!-- 5. PRIMARY TIMER CONTROLS -->
    <section class="controls-row">
      <button type="button" class="btn-main" id="startStopBtn">
        <span id="startStopIcon">▶</span>
        <span id="startStopText">Start Timer</span>
      </button>
      <button type="button" class="btn-reset" id="resetBtn" aria-label="Reset Timer" title="Reset Timer">
        ↺
      </button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
